questions:
  # Hand-written override for the generated MC on this term.
  - term: health checks
    type: mc
    sectionId: health-checks-and-targets
    prompt: Why can a working application be taken out of rotation by a load balancer?
    choices:
      - The health check path or port does not match what the application serves
      - The application is not in the same VPC as the load balancer
      - The target has an elastic IP address
      - Cross-zone load balancing is disabled
    answer: 0
    explanation: A target is only healthy when the health check succeeds, so a missing path removes the whole fleet.

  - type: mc
    sectionId: the-three-load-balancers
    prompt: Which load balancer works at layer 7 and can route by path?
    choices:
      - Application load balancer
      - Network load balancer
      - Gateway load balancer
      - Elastic IP
    answer: 0
    explanation: Only the application load balancer understands HTTP, so it can route by host, path, or query.

  - type: mc
    sectionId: the-three-load-balancers
    prompt: Which load balancer can insert third-party appliances into the traffic path?
    choices:
      - Gateway load balancer
      - Application load balancer
      - Network load balancer
      - NAT gateway
    answer: 0
    explanation: The gateway load balancer uses GENEVE encapsulation so appliances can inspect the flow transparently.

  - type: mc
    sectionId: the-three-load-balancers
    prompt: Which statement about client IP addresses is correct?
    choices:
      - A network load balancer keeps the client IP for instance targets, an application load balancer does not
      - Both load balancers keep the client IP by default
      - Neither load balancer keeps the client IP
      - Only the gateway load balancer keeps the client IP
    answer: 0
    explanation: An application load balancer terminates the connection and passes the original address in the X-Forwarded-For header; client IP preservation is off by default for IP-type target groups.

  - type: cloze
    sectionId: health-checks-and-targets
    prompt: "A network load balancer health check defaults to ____ on the traffic port, while an application load balancer defaults to HTTP."
    answer: TCP
    explanation: The NLB default health check protocol is TCP; the ALB default is HTTP.

  - type: cloze
    sectionId: elastic-ips-and-public-entry-points
    prompt: "A network load balancer can be given one elastic IP per ____, which keeps its entry point stable."
    answer: zone
    explanation: One elastic IP per subnet, one per zone, keeps the public entry point fixed while the targets are replaced.
