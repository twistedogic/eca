questions:
  # Hand-written overrides for the generated MCs on these terms.
  - term: pip
    type: mc
    sectionId: the-pip
    prompt: What does one pip represent on a EUR/USD quote?
    choices:
      - The fourth decimal place, 0.0001
      - The fifth decimal place, 0.00001
      - The third decimal place, 0.001
      - The second decimal place, 0.01
    answer: 0
    explanation: A pip is 0.0001 on most pairs and 0.01 on yen pairs; the finer fifth decimal is a pipette.

  - term: standard lot
    type: mc
    sectionId: lot-size-and-pip-value
    prompt: How many units of the base currency does one standard lot represent?
    choices:
      - 100,000
      - 10,000
      - 1,000
      - 1,000,000
    answer: 0
    explanation: A standard lot is 100,000 units of the base currency; a mini lot is 10,000 and a micro lot is 1,000.

  # Calculation questions the generator cannot produce.
  - type: mc
    sectionId: lot-size-and-pip-value
    prompt: What is the pip value of one pip on a standard lot of EUR/USD?
    choices:
      - $10
      - $1
      - $100
      - $0.10
    answer: 0
    explanation: On a USD-quoted pair, one pip on a standard lot is 0.0001 x 100,000 = $10.

  - type: mc
    sectionId: lot-size-and-pip-value
    prompt: At USD/JPY 150.00, what is the pip value of one pip on a standard lot?
    choices:
      - About $6.67
      - About $10
      - About $15
      - About $1.50
    answer: 0
    explanation: "When the dollar is the base currency the pip value depends on the rate: 100,000 x 0.01 / 150 = about $6.67."

  - type: cloze
    sectionId: lot-size-and-pip-value
    prompt: "A mini lot is ____ units of the base currency."
    answer: 10,000
    explanation: Mini is 10,000 units, standard is 100,000 and micro is 1,000.
