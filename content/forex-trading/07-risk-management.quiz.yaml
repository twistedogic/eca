questions:
  - type: mc
    sectionId: size-the-position-from-the-stop
    prompt: A $10,000 account risks 1% per trade on EUR/USD with a 50-pip stop. Which position size is correct?
    choices:
      - 0.20 lots
      - 2.00 lots
      - 0.02 lots
      - 1.00 lot
    answer: 0
    explanation: Risk $100, and a standard lot carries $500 over 50 pips, so $100 / $500 = 0.20 lots.

  - type: mc
    sectionId: drawdown-is-asymmetric
    prompt: After a 20% drawdown, what gain is needed to get back to the starting balance?
    choices:
      - 25%
      - 20%
      - 22%
      - 30%
    answer: 0
    explanation: "The gain is d / (1 - d): 0.20 / 0.80 = 25%, because the recovery is earned on the smaller balance."

  - type: mc
    sectionId: correlation-is-hidden-size
    prompt: You are long EUR/USD and long USD/CHF at the same time. What is the net exposure?
    choices:
      - Net short the dollar
      - Net long the dollar
      - Roughly balanced, one risk offsetting the other
      - Long EUR and short CHF with no dollar exposure
    answer: 0
    explanation: EUR/USD long is dollar-short and USD/CHF long is also dollar-short, so the two trades stack into one large dollar position.

  - term: R multiples
    type: mc
    sectionId: define-risk-in-r
    prompt: A trade risked $100 at its stop and closed for a $250 profit. How many R is that?
    choices:
      - +2.5R
      - +1.5R
      - +2.0R
      - -1.5R
    answer: 0
    explanation: 1R is the planned risk, so $250 of profit against $100 of risk is +2.5R.

  - type: cloze
    sectionId: drawdown-is-asymmetric
    prompt: "A 50% drawdown needs a ____ gain to recover."
    answer: 100%
    explanation: "The gain is d / (1 - d): 0.50 / 0.50 = 100%, so you must double what remains."
